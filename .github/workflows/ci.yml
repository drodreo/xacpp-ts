name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (src + tests)
        run: pnpm exec tsc -p tsconfig.check.json --noEmit

      - name: Test
        run: pnpm exec vitest run

      - name: Build
        run: pnpm run build

      # Examples import the built artifact (../dist/esm/index.mjs) for both
      # runtime and types, so this check must run after Build.
      - name: Typecheck (examples)
        run: pnpm exec tsc -p examples/tsconfig.json --noEmit
